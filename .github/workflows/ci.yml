# Runs our tests on every pull request, and again after each merge to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Some tests compare commits.

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and its test tools
        run: pip install -e ".[dev]" -r backend/requirements.txt

      - name: Run the tests
        run: pytest
