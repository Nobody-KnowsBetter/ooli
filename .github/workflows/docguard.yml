# DocGuard checking its own pull requests, using the Action in this repository.
name: DocGuard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
