services:
  - type: web
    name: ooli-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DOCGUARD_AI_PROVIDER
        value: heuristic
      - key: DATABASE_URL
        value: sqlite:///./docguard.db

